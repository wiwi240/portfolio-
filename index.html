<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/logo-portfolio.svg" type="image/svg+xml" fetchpriority="high" />
    <!-- Self-hosted fonts (declared in src/fonts.css): the two used above the fold are fetched right away. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/satoshi-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cabinet-grotesk-800.woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--seo:start-->
    <!-- Dev defaults: replaced per page at build time by scripts/prerender.mjs (from src/seo.ts). -->
    <title>Création de site internet à Coulommiers — William Mahi</title>
    <meta name="description" content="Site internet, réservation en ligne, outil de gestion : des solutions simples pour les TPE, artisans et commerçants de Seine-et-Marne. Devis gratuit." />
    <link rel="canonical" href="https://www.williammahi.dev/" />
    <!--seo:end-->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      const savedTheme = localStorage.getItem('theme') ?? 'light'
      document.documentElement.classList.toggle('dark', savedTheme === 'dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
